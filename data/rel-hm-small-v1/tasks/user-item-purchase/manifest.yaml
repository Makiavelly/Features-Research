name: user-item-purchase
kind: forecast
task_type: recommendation
description: Predict the list of articles each customer will purchase in the next seven days.
target_col: article_id
time_col: timestamp
src_entity_table: customer
src_entity_col: customer_id
dst_entity_table: article
dst_entity_col: article_id
eval_k: 12
timedelta: 7 days
sql: |-
  SELECT
      t.timestamp,
      transactions.customer_id,
      LIST(DISTINCT transactions.article_id) AS article_id
  FROM
      timestamps t
  LEFT JOIN
      transactions
  ON
      transactions.t_dat > t.timestamp AND
      transactions.t_dat <= t.timestamp + INTERVAL '{timedelta}'
  GROUP BY
      t.timestamp,
      transactions.customer_id
manifest_version: 1
